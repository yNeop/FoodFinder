<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore receitas e encontre seu próximo prato favorito no FoodFinder.">
    <title>Explorar receitas | FoodFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/explore.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="../index.html">FoodFinder</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Abrir menu de navegação"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#fim">Fim</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="https://github.com/yNeop/FoodFinder">GitHub<img src="../assets/icons/github.png" alt="github_logo"></a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="flex-grow-1">
        <section class="explore-hero">
            <div class="container">
                <h1>Explore receitas</h1>
                <p>Pesquise por nome ou escolha uma categoria para encontrar seu próximo prato.</p>
            </div>
        </section>
        <section class="py-5">
            <div class="container">
                <form id="exploreSearchForm" class="row g-3 mb-4">
                    <div class="col-12 col-md-7">
                        <label for="exploreSearchInput" class="form-label">Nome da receita</label>
                        <input id="exploreSearchInput" class="form-control" type="search" placeholder="Ex.: chicken, pasta..." required>
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="exploreCategorySelect" class="form-label">Categoria</label>
                        <select id="exploreCategorySelect" class="form-select"><option value="">Todas as categorias</option></select>
                    </div>
                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button id="exploreSearchButton" class="btn btn-primary w-100" type="submit">Pesquisar</button>
                    </div>
                </form>
                <p id="exploreStatus" class="visually-hidden" role="status" aria-live="polite"></p>
                <div id="exploreRecipes" class="row g-4" aria-live="polite"></div>
            </div>
        </section>
    </main>
    <footer id="fim"><div class="container text-center"><p>&copy; 2026 FoodFinder. Todos os direitos reservados.</p><p>Desenvolvido com HTML, CSS, JavaScript, Bootstrap 5 e TheMealDB API.</p></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/modules/explore.js"></script>
</body>
</html>
